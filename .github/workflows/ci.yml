name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: pytest (тесты используют SQLite in-memory + Redis-сервис) ──
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      # Settings() требует эти переменные на импорте (тесты ходят в SQLite, не в postgres)
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q

  # ── E2E: Playwright против поднятого docker-стека ──
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Минимальный .env для docker compose (подстановка ${POSTGRES_*} и т.п.)
      - name: Create .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=shop
          POSTGRES_PASSWORD=shop
          POSTGRES_DB=shop
          SECRET_KEY=ci-test-secret
          REDIS_URL=redis://redis:6379/0
          ALLOWED_ORIGINS=["http://localhost:3000"]
          EOF

      - name: Поднять стек
        run: docker compose up -d --build

      - name: Дождаться backend и применить миграции
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/health && break || sleep 3
          done
          docker compose exec -T backend alembic upgrade head

      # Сид каталога: каталог приходит из МойСклад, в CI его нет — заводим пару товаров,
      # чтобы тесты каталога/карточки имели данные (purchase-тест сидит свой товар сам).
      - name: Сид каталога
        run: |
          docker compose exec -T backend python3 - <<'PY'
          from app.db.session import SessionLocal
          from app.db.models.product import Product
          from decimal import Decimal
          db = SessionLocal()
          rows = [
              ("ci-1", "ms-ci-1", "Тестовый товар один", "CI-001", Decimal("100"), 5),
              ("ci-2", "ms-ci-2", "Тестовый товар два",  "CI-002", Decimal("200"), 3),
          ]
          for pid, ms, name, art, price, stock in rows:
              if not db.get(Product, pid):
                  db.add(Product(id=pid, moysklad_id=ms, name=name, article=art,
                                 price=price, stock=stock, is_active=True))
          db.commit(); db.close()
          print("seeded")
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        run: cd frontend && npx playwright test
        env:
          E2E_BASE_URL: http://localhost

      - name: Логи стека при падении
        if: failure()
        run: docker compose logs --tail=100
