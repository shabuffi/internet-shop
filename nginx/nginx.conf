# Лимит запросов к картинкам по IP (см. location с limit_req ниже). Ответ при превышении — 429.
limit_req_zone $binary_remote_addr zone=images:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;

    # Лимит размера тела запроса — как в prod (иначе дефолт nginx 1 МБ режет
    # загрузку иконок/логотипов/картинок и CommerceML XML → 413 Request Entity Too Large).
    client_max_body_size 20M;

    # API запросы → backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Картинки товаров и /admin/media: отдельный лимит запросов (защита от выкачки каталога
    # скриптом). Запас 300 — три страницы «Список» (по 100 превью) подряд; покупатель не упрётся.
    location ~ ^/api/v1/(products/[^/]+/image|admin/media/[^/]+)$ {
        limit_req zone=images burst=300 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Файлы картинок по X-Accel-Redirect от backend (MEDIA_ACCEL=true): байты отдаёт nginx,
    # а не Python. internal — снаружи адрес недоступен, только по команде backend.
    location /_media/ {
        internal;
        alias /srv/media/;
    }

    # OpenAPI документация → backend
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Всё остальное → frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
