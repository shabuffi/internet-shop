# HTTP: ACME-челлендж (обновление сертификата) + редирект всего остального на HTTPS
server {
    listen 80;
    server_name td-engineer.ru www.td-engineer.ru;

    # Let's Encrypt webroot — для выпуска/продления сертификата без остановки nginx
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основной сервер
server {
    listen 443 ssl;
    http2 on;
    server_name td-engineer.ru www.td-engineer.ru;

    ssl_certificate     /etc/letsencrypt/live/td-engineer.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/td-engineer.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Лимит размера тела запроса (для CommerceML XML от МойСклад)
    client_max_body_size 20M;

    # Docker DNS: nginx будет пере-resolve'ить backend/frontend, если контейнеры
    # пересоздались и получили новые IP (иначе после рестарта можно словить 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /docs {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
